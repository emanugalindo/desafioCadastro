spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/dev_database
    username: dev_user
    password: dev_password
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

server:
  port: 8080